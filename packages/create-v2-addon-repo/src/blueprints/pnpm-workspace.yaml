allowBuilds:
  unrs-resolver: false

autoDedupe: true

autoInstallPeers: false

lockfile:
  includeResolutionSettings: true

minimumReleaseAgeExclude:
  - "@codemod-utils/*"
  - "@ijlee2-frontend-configs/*"

packages:
  - "blueprints/v2-addon"
  - "configs/**"
  - "docs-app"
  - "packages/**"
  - "test-app"

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*stylelint*"

resolvePeersFromWorkspaceRoot: false

verifyDepsBeforeRun: "warn"
